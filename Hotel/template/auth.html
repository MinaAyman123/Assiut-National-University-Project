<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - VillaScape</title>

    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/pages.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card animate-scale-in">
            <div class="auth-header">
                <a href="index.html"
                    style="font-size: var(--font-size-3xl); font-weight: var(--font-bold); text-decoration: none;">
                    🏝️ VillaScape
                </a>
                <p style="margin-top: var(--space-2); color: var(--color-gray-600);">Welcome back! Please enter your
                    details.</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" style="display: block;">
                <div class="input-group">
                    <label for="login-email" class="input-label">Email</label>
                    <input type="email" id="login-email" class="input-field" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="login-password" class="input-label">Password</label>
                    <input type="password" id="login-password" class="input-field" placeholder="Enter your password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">
                    Login
                </button>
            </form>

            <!-- Sign Up Form -->
            <form id="signup-form" style="display: none;">
                <div class="input-group">
                    <label for="signup-name" class="input-label">Full Name</label>
                    <input type="text" id="signup-name" class="input-field" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label for="signup-email" class="input-label">Email</label>
                    <input type="email" id="signup-email" class="input-field" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="signup-password" class="input-label">Password</label>
                    <input type="password" id="signup-password" class="input-field" placeholder="Create a password"
                        required>
                </div>

                <div class="input-group">
                    <label for="signup-confirm" class="input-label">Confirm Password</label>
                    <input type="password" id="signup-confirm" class="input-field" placeholder="Confirm your password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">
                    Create Account
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button class="social-btn" onclick="loginWithGoogle()">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Continue with Google
                </button>

                <button class="social-btn" onclick="loginWithApple()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
                    </svg>
                    Continue with Apple
                </button>
            </div>

            <p
                style="text-align: center; margin-top: var(--space-6); font-size: var(--font-size-sm); color: var(--color-gray-500);">
                <a href="index.html" style="color: var(--color-primary);">← Back to Home</a>
            </p>
        </div>
    </div>

    <script src="/static/js/data.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/booking.js"></script>
    <script src="/static/js/utils.js"></script>

    <script>
        // Tab switching
        function switchTab(tab) {
            const loginTab = document.querySelectorAll('.auth-tab')[0];
            const signupTab = document.querySelectorAll('.auth-tab')[1];
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');

            if (tab === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                loginTab.classList.remove('active');
                signupTab.classList.add('active');
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
            }
        }

        // Login form submit
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            clearFormErrors();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const result = login(email, password);

            if (result.success) {
                showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    const redirect = getURLParameter('redirect') || 'index.html';
                    window.location.href = redirect;
                }, 1000);
            } else {
                showToast(result.message, 'error');
            }
        });

        // Signup form submit
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            clearFormErrors();

            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;

            const result = signUp(email, password, confirm, name);

            if (result.success) {
                showToast('Account created successfully! Redirecting...', 'success');
                setTimeout(() => {
                    const redirect = getURLParameter('redirect') || 'index.html';
                    window.location.href = redirect;
                }, 1000);
            } else {
                showToast(result.message, 'error');
            }
        });

        // Check if already logged in
        if (isLoggedIn()) {
            const redirect = getURLParameter('redirect') || 'dashboard.html';
            window.location.href = redirect;
        }
    </script>
</body>

</html>
