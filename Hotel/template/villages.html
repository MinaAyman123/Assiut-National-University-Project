<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and discover amazing tourist villages">
    <title>Browse Villages - VillaScape</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/pages.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <button class="mobile-menu-toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12h18M3 6h18M3 18h18"></path>
            </svg>
        </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="villages-grid-container container-wide">
        <!-- Filters Sidebar -->
        <aside class="filters-sidebar">
            <h3 style="margin-bottom: var(--space-5); font-size: var(--font-size-2xl);">Filters</h3>

            <form id="filter-form">
                <div class="filter-section">
                    <h4 class="filter-title">Price Range</h4>
                    <div class="price-range">
                        <label class="input-label">Max Price: <span id="price-value">$1000</span></label>
                        <input type="range" id="search-price" name="maxPrice" min="100" max="1000" value="1000"
                            step="50" oninput="document.getElementById('price-value').textContent = '$' + this.value">
                    </div>
                </div>

                <div class="filter-section">
                    <h4 class="filter-title">Category</h4>
                    <div class="filter-options">
                        <label class="checkbox-label">
                            <input type="radio" name="category" value="">
                            All Categories
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="category" value="coastal">
                            Coastal
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="category" value="mountain">
                            Mountain
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="category" value="tropical">
                            Tropical
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="category" value="desert">
                            Desert
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="category" value="countryside">
                            Countryside
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <h4 class="filter-title">Rating</h4>
                    <div class="filter-options">
                        <label class="checkbox-label">
                            <input type="radio" name="minRating" value="">
                            All Ratings
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="minRating" value="4.5">
                            4.5+ ⭐
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="minRating" value="4.0">
                            4.0+ ⭐
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="minRating" value="3.5">
                            3.5+ ⭐
                        </label>
                    </div>
                </div>

                <button type="reset" class="btn btn-outline" style="width: 100%;"
                    onclick="setTimeout(() => loadVillages(), 100)">
                    Clear Filters
                </button>
            </form>
        </aside>

        <!-- Villages Grid -->
        <main class="villages-main">
            <div class="sort-bar">
                <div class="village-count" id="village-count">Loading...</div>

                <select id="sort-select" class="sort-select">
                    <option value="popular">Most Popular</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="rating">Highest Rated</option>
                </select>
            </div>

            <div id="villages-grid" class="grid grid-cols-3">
                <!-- Villages will be loaded by JavaScript -->
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>VillaScape</h4>
                    <p
                        style="color: var(--color-gray-400); font-size: var(--font-size-sm); line-height: var(--line-height-relaxed);">
                        Discover and book the world's most beautiful tourist villages.
                    </p>
                </div>

                <div class="footer-section">
                    <h4>Quick Links</h4>
                    <ul class="footer-links">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="villages.html">Browse Villages</a></li>
                        <li><a href="auth.html">Login / Sign Up</a></li>
                    </ul>
                </div>

                <div class="footer-section">
                    <h4>Support</h4>
                    <ul class="footer-links">
                        <li><a href="#contact">Contact Us</a></li>
                        <li><a href="#faq">FAQ</a></li>
                        <li><a href="#help">Help Center</a></li>
                    </ul>
                </div>

                <div class="footer-section">
                    <h4>Newsletter</h4>
                    <input type="email" placeholder="Your email" class="input-field"
                        style="margin-bottom: var(--space-2);">
                    <button class="btn btn-primary" style="width: 100%;">Subscribe</button>
                </div>
            </div>

            <div class="footer-bottom">
                <p>&copy; 2025 VillaScape. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/static/js/data.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/booking.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
